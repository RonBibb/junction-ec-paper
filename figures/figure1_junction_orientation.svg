<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Kantowski–Sachs and Schwarzschild timelike junction geometry</title>
  <desc id="desc">A timelike spherical shell separates a homogeneous Kantowski–Sachs side from the retained asymptotically flat Schwarzschild exterior. The parent normal points toward increasing areal radius and spatial infinity.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <marker id="arrowOpen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#111" stroke-width="1.5"/>
    </marker>
    <pattern id="ksHatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#777" stroke-width="1"/>
    </pattern>
    <pattern id="extDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#999"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="690" fill="#fff"/>

  <text x="600" y="42" text-anchor="middle" font-family="serif" font-size="27" font-weight="600">
    Declared timelike junction and retained regions
  </text>

  <rect x="72" y="92" width="440" height="455" fill="url(#ksHatch)" stroke="#111" stroke-width="2"/>
  <rect x="512" y="92" width="616" height="455" fill="url(#extDots)" stroke="#111" stroke-width="2"/>

  <text x="292" y="132" text-anchor="middle" font-family="serif" font-size="24" font-weight="600">
    Homogeneous Kantowski–Sachs side
  </text>
  <text x="820" y="132" text-anchor="middle" font-family="serif" font-size="24" font-weight="600">
    Retained Schwarzschild exterior
  </text>

  <text x="292" y="170" text-anchor="middle" font-family="serif" font-size="20">
    R = B(t_C),  ∂χR = 0
  </text>
  <text x="820" y="170" text-anchor="middle" font-family="serif" font-size="20">
    F(R) = 1 − 2m/R &gt; 0
  </text>

  <path d="M512 92 C485 180, 539 272, 512 365 C485 455, 539 500, 512 547"
        fill="none" stroke="#111" stroke-width="7"/>
  <text x="535" y="325" font-family="serif" font-size="22" font-weight="600">Σ</text>
  <text x="535" y="354" font-family="serif" font-size="18">timelike shell</text>
  <text x="535" y="380" font-family="serif" font-size="18">R = R(τ)</text>

  <line x1="518" y1="250" x2="685" y2="250" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="231" text-anchor="middle" font-family="serif" font-size="20">
    n_P,  ε_P = +1
  </text>

  <line x1="675" y1="420" x2="965" y2="420" stroke="#111" stroke-width="2.5" marker-end="url(#arrowOpen)"/>
  <text x="820" y="401" text-anchor="middle" font-family="serif" font-size="20">
    increasing areal radius R
  </text>

  <circle cx="1060" cy="420" r="7" fill="#111"/>
  <text x="1060" y="390" text-anchor="middle" font-family="serif" font-size="20">
    spatial infinity
  </text>

  <line x1="505" y1="470" x2="397" y2="470" stroke="#111" stroke-width="2.5" marker-end="url(#arrowOpen)"/>
  <text x="445" y="451" text-anchor="middle" font-family="serif" font-size="20">
    ε_C = ±1
  </text>

  <line x1="72" y1="585" x2="1128" y2="585" stroke="#111" stroke-width="1.5"/>
  <text x="72" y="620" font-family="serif" font-size="19">
    Ordinary exterior branch: the retained parent region contains spatial infinity, so n_P points toward +R.
  </text>
  <text x="72" y="650" font-family="serif" font-size="19">
    The ε_P = −1 algebraic branch retains a different Schwarzschild side and is not a sign alternative for this gluing.
  </text>
</svg>
